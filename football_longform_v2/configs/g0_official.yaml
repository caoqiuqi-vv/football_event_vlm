schema_version: football_longform_v2.alpha2
experiment_id: g0_backbone_ablation_official
seed: 42

paths:
  workspace_root: ..
  output_dir: experiments/g0_backbone_ablation/official
  feature_store: experiments/g0_backbone_ablation/features/official
  annotations: /mnt/data_16t/football/football_events_human_repair
  train_ids: ../configs/football/splits/thirdparty18_holdout_all_rest_train/train_fit_video_ids.txt
  calibration_ids: ../configs/football/splits/thirdparty18_holdout_all_rest_train/calibration_20_video_ids.txt
  thirdparty_test_ids: ../configs/football/splits/thirdparty18_holdout_all_rest_train/thirdparty18_test_video_ids.txt

task:
  output_labels: [shot, save, corner, penalty, freekick, kickoff]
  proposal_families: [shot_chain, restart, generic_event]
  family_members:
    shot_chain: [shot, save]
    restart: [corner, penalty, freekick, kickoff]

features:
  timeline_hz: 5.0
  context:
    name: dino_context
    required: true
    dim: 2048
    source_hz: 2.0
    arch: dinov3_vitl16
    backbone_id: official_lvd1689m
    weights: ../checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
    image_size: [224, 384]
  motion:
    name: rgb_flow_grid
    required: true
    dim: 256
    source_hz: 8.0
    grid_size: [16, 16]
  entity:
    name: entity_motion
    enabled: false
    required: false
    dim: 19
    dropout: 0.80
    max_residual_logit: 0.15

model:
  hidden_dim: 256
  encoder_levels: 4
  blocks_per_level: 2
  kernel_size: 5
  dropout: 0.10
  time_fourier_bands: 8

train:
  sequence_seconds: 120.0
  batch_size: 4
  blocks_per_video: 8
  positive_probability: 0.75
  temporal_jitter_seconds: 15.0
  learning_rate: 0.0003
  weight_decay: 0.05
  focal_alpha: 0.25
  focal_gamma: 2.0

decode:
  threshold: 0.25
  nms_radius_seconds: {shot_chain: 3.0, restart: 6.0, generic_event: 3.0}
  max_proposals_per_minute: {shot_chain: 3.0, restart: 2.0, generic_event: 1.0}

acceptance:
  rgb_only_checkpoint_selection: true
  forbid_detection_gated_proposals: true
  shot_chain_recall_at_budget: 0.97
  restart_recall_at_budget: 0.97
  max_entity_missing_recall_drop: 0.005
  max_corrupted_entity_recall_drop: 0.010

external_providers:
  yolo_structure:
    enabled: false
    project_root: ../../det_and_track
    checkpoint: ../../det_and_track/checkpoints/yolo11m_person_goal_fieldLine_1920_7.22.pt
    person_class: 0
    goal_class: 1
    field_line_class: 2
    ball_class: -1
    sample_fps: 2.0
  rfdetr_ball_teacher:
    enabled: false
    project_root: ../../SoccerMind-main
    checkpoint: ../../SoccerMind-main/rf-detrm-p2.pth
    preset: ../../SoccerMind-main/engines/rf_detr/config/rf_detr_inference_medium_p2_sahi160_recheck320_hybrid_idstable_relink.yaml
    sample_fps: 5.0
