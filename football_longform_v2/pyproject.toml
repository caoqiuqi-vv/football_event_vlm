[project]
name = "football-longform-v2"
version = "0.1.0"
description = "RGB-first continuous timeline football event spotting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6.0", "torch>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_longform_v2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
