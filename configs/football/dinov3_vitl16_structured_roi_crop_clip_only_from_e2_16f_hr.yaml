output_dir: outputs/football_events/vitl16_structured_roi_crop_clip_only_from_e2_16f_hr

device: cuda:0
gpu_ids: [0]
seed: 42
deterministic: true

task:
  label_schema: set_piece

data:
  mode: long_videos
  long_video:
    roots:
      - source: xbotgo_0608
        videos_dir: /mnt/data_16t/football/raw_video_720P
        annotations_dir: /home/new_users/qiuqi/code/football_events_human_repair
    split_files:
      train:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
      val_ratio: 0.2
      seed: 42
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    negative_safety_margin_sec: 4.0
    negative_label_safety_margin_sec:
      shot: 4.0
      save: 4.0
      set_piece: 6.0
    hard_negative:
      enabled: false
      manifest: ""
      min_score: 0.0
      max_per_video: 0
      safety_margin_sec: 8.0
      include_in_val: false
  num_workers_per_gpu: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 1
  preprocessing:
    normalize_on_device: true

video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size: [640, 1120]
  hflip_prob: 0.5

spatial_crop:
  mode: none

model:
  architecture_version: structured_roi_crop_clip_only
  backbone: dinov3_vitl16
  weights: checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  init_checkpoint: ""
  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: true
  freeze_loaded_backbone: true
  freeze_global_branch: true
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  frame_feature_mode: last_cls_patch_mean
  temporal_fusion: cls_transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  view_fusion: single
  gradient_checkpointing: false

  featuremap_structured:
    init_checkpoint: outputs/football_events/vitl16_featuremap_dual_roi_pr_correction_from_structured_e2_16f_hr/best.pt
    spatial_grid: [3, 5]
    token_dim: 256
    topk_frames: 4
    exploration_frames: 2
    temporal_layers: 2
    num_heads: 8
    sparsemax_temperature: 4.0
    bin_bandwidth: 0.55
    gate_init: 0.1
    max_clip_delta: 1.0
    max_frame_delta: 0.75

  roi_crop_clip:
    topk_frames: 4
    exploration_frames: 2
    crop_height: 256
    crop_width: 448
    crop_scale_x: 0.35
    crop_scale_y: 0.35
    encode_chunk_size: 12
    temporal_layers: 2
    num_heads: 8
    gate_init: 0.02
    max_delta: 1.0

  spatial_attention:
    enabled: true
    mode: adaspot_feature_fusion
    patch_mode: last_layer
    dynamic_query_scale_init: 0.1
    attention_dim: 256
    queries_per_class: 2
    context_layers: 1
    temporal_layers: 2
    num_heads: 8
    gate_init: 0.25
    correction_dim: 128
    correction_gate_init: 0.15
    correction_max_delta: 1.5
    return_attention_maps: true

  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 12
    target_modules:
      - attn.qkv
      - attn.proj
      - mlp.fc1
      - mlp.fc2
    train_norm: true

cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_structured_roi_crop_clip_only
  batch_size: 1
  rebuild: false

train:
  epochs: 1
  per_gpu_batch_size: 2
  grad_accum_steps: 2
  lr_per_gpu: 2.0e-5
  backbone_lr_per_gpu: 0.0
  global_backbone_lr_per_gpu: 0.0
  weight_decay: 0.05
  pos_weight: [1.0, 2.5, 4.0]
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  clip_loss_weight: 0.6
  clip_loss_balance: per_class_equal_pos_neg
  amp: true
  amp_dtype: bf16
  log_interval: 10
  save_epoch_checkpoints: false
  save_pre_eval_recovery: false
  checkpoint_selection: tuned_macro_precision_at_recall_floor
  checkpoint_min_recall: 0.75
  resume:
    enabled: false
    checkpoint: ""
    strict: true
    load_optimizer: false
    load_scheduler: false
    load_scaler: false

  # The local crop classifier is the only independent ROI supervision.
  spatial_clip_loss_weight: 0.4
  positive_retention_loss_weight: 0.25
  positive_retention_margin: 0.0
  positive_retention_branch: fused
  negative_teacher_guard_loss_weight: 0.25
  negative_teacher_guard_labels: [shot, save, set_piece]
  negative_teacher_guard_margin: 0.0
  negative_teacher_guard_branch: fused

  # Hard separation: no ROI/frame/proposer gradients in this experiment.
  frame_det_loss_weight: 0.0
  spatial_temporal_localization_loss_weight: 0.0
  structured_frame_temporal_localization_loss_weight: 0.0
  spatial_attention_mil_loss_weight: 0.0
  spatial_attention_query_diversity_loss_weight: 0.0
  spatial_attention_concentration_loss_weight: 0.0
  spatial_attention_overlap_loss_weight: 0.0
  spatial_counterfactual_loss_weight: 0.0
  global_conditioned_correction_loss_weight: 0.0
  global_backbone_lr: 0.0
  local_backbone_lr: 0.0

eval:
  threshold: 0.5
  per_gpu_batch_size: 2
  tuned_min_recall:
    shot: 0.84
    save: 0.78
    set_piece: 0.65
