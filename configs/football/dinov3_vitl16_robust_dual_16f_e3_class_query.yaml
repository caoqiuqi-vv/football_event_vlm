output_dir: outputs/football_events/vitl16_robust_dual_16f_e3_class_query
device: cuda:0
gpu_ids:
- 0
- 1
seed: 42
deterministic: true
task:
  label_schema: set_piece
data:
  mode: long_videos
  long_video:
    roots:
    - source: xbotgo_0608
      videos_dir: /mnt/data_16t/football/raw_video_720P
      annotations_dir: /home/new_users/qiuqi/code/football_events_human_repair
    split_files:
      train:
      - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
      - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
      val_ratio: 0.2
      seed: 42
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: false
      manifest: ''
      min_score: 0.7
      max_per_video: 20
      safety_margin_sec: 2.0
      include_in_val: false
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true
video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size:
  - 384
  - 640
  hflip_prob: 0.5
spatial_crop:
  mode: robust_detector_aware
  index_root: outputs/football_roi_indices/robust_v2
  require_index: true
  output_view: dual
  global_image_size:
  - 384
  - 672
  padding: 0.15
  min_crop_area_ratio: 0.0
  max_crop_area_ratio: 0.35
  min_roi_confidence: 0.4
  goal_conf: 0.4
  person_conf: 0.35
  center_circle_conf: 0.35
  raw_ball_conf: 0.1
  min_goal_frames: 3
  min_ball_points: 5
  max_people: 10
  max_cached_videos: 2
  noise_augmentation:
    invalid_prob: 0.15
    ball_drop_prob: 0.1
    goal_drop_prob: 0.1
    isolated_false_positive_prob: 0.05
    center_jitter: 0.08
    scale_min: 1.0
    scale_max: 1.0
model:
  backbone: dinov3_vitl16
  weights: /mnt/data_16t/football/qiuqi/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  init_checkpoint: /mnt/data_16t/football/qiuqi/checkpoints/vitl16_robust_dual_16f.pt
  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: true
  freeze_loaded_backbone: true
  freeze_global_branch: false
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: class_query_transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  view_fusion: dual_gate
  roi_meta_dim: 16
  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 4
    target_modules:
    - attn.qkv
    - attn.proj
    train_norm: false
cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_robust_dual_16f_exp4
  batch_size: 1
  rebuild: false
train:
  epochs: 6
  batch_size: 2
  grad_accum_steps: 12
  lr: 0.0002
  backbone_lr: 0.0
  weight_decay: 0.05
  pos_weight:
  - 1.0
  - 2.5
  - 4.0
  pos_weight_max: 50.0
  local_loss_weight: 0.2
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: false
  checkpoint_selection: default_precision_at_recall_floor
  checkpoint_min_recall: 0.6
  resume:
    enabled: false
    checkpoint: ''
    strict: true
    load_optimizer: true
    load_scheduler: true
    load_scaler: true
  frame_det_loss_weight: 0.5
  frame_det_loss_type: focal_bce
  frame_heatmap_loss_weight: 0.5
  frame_mil_loss_weight: 0.3
  frame_rank_loss_weight: 0.2
  frame_mil_topk: 3
  frame_eval_topk: 4
  frame_rank_pos_threshold: 0.5
  frame_rank_neg_threshold: 0.05
  frame_rank_margin: 1.0
  frame_label_sigma_sec:
    shot: 0.8
    save: 0.8
    set_piece: 1.5
  frame_label_ignore_radius_sec:
    shot: 3.0
    save: 3.0
    set_piece: 5.0
eval:
  threshold: 0.5
  batch_size: 2
