experiment_notes:
  purpose_v4: 'v3 supervision stack + (1) shot hard-positive-tail margin loss with EMA floor (pull up the positive tail that collapses to ~0 and forces tuned thresholds to ~0) and (2) save-conditioned-on-shot: zero-init additive residual from detached shot frame tokens (window-max score + time since peak) into the save head. Loss structure otherwise unchanged from v3.'
  v4_hpm_floor_not_checkpointed: 'EMA floor state lives only in-process; after resume it re-warms from hard_positive_tail_margin (~100 positive batches).'
  v4_conditioning_approximation: 'Window-level max/argmax over the whole clip; a shot after save in the same window leaks into conditioning (accepted; causal cummax is the v2 upgrade).'
  v4_decode_guard: 'Wall-clock deadline per decode attempt (data.decode_attempt_timeout_sec=60); raised VideoDecodeError feeds the existing retry/mask path. Cannot interrupt a single infinitely-blocked cap.grab(); FFmpeg 10s constructor timeouts remain the backstop.'
  purpose_v3: 'Supervision repair: human-accepted anchors + raw accepted context-span coverage + raw rejected set-piece ignore zones + dataset-level save cohorts + frequency-balanced set-piece subtype auxiliary; head size unchanged.'
  init_protocol_v3: 'Warm-start from the best last8/r8 progressive checkpoint; fresh optimizer/scheduler/EMA; new subtype head randomly initialized.'
  evaluation_protocol_v3: 'Val15 alone tunes thresholds/selects checkpoints at recall floors shot=0.85, save=0.80, set_piece=0.80. External18 is evaluated only with frozen Val15 thresholds; combined33 is diagnostic and never selects checkpoints.'
  supervision_init: epoch1 best.pt from the verified last8/r8 progressive run; fresh optimizer/scheduler/EMA
  acceleration_changes: trainable-block-only activation checkpointing; EMA-only validation; eval batch 4
  purpose: 'Independent event spaces before shared compression: per-class patch routing
    + explicit no-evidence + per-class appearance/motion temporal modeling, with verified
    DDP LoRA updates.'
  raw_input_alignment: raw_video_720P; no HQ switch in this experiment
  train_split: configs/football/splits/thirdparty18_test_long15_val_no_pn_train/train_video_ids.txt
  threshold_val_split: configs/football/splits/thirdparty18_test_long15_val_no_pn_train/internal_val_video_ids.txt
  untouched_test_split: configs/football/splits/thirdparty18_test_long15_val_no_pn_train/thirdparty18_test_video_ids.txt
  effective_batch: 2 per GPU x 4 DDP ranks x 8 accumulation = 64
  lora_protocol: inherited trained DINOv3 adaptation; last 8 blocks; r8 alpha16; qkv+attn.proj;
    DDP mandatory; LoRA gradient/update gate must pass before launch
  learning_rates_effective_after_global_batch_scaling:
    lora: 5.0e-05
    shared_temporal: 6.6666668e-05
    class_evidence_router_temporal: 0.0002
    class_evidence_head: 0.0003
  checkpoint_policy: best.pt + last.pt only
  ddp_efficiency: rank-0 aggregated logging; gradient all-reduce only at accumulation
    boundaries; scheduler counts optimizer steps
