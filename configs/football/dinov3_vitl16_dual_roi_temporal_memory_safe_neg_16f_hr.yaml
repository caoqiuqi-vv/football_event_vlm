output_dir: outputs/football_events/vitl16_dual_roi_temporal_memory_safe_neg_16f_hr
device: cuda:0
gpu_ids: [0, 1, 2, 3]
seed: 42
deterministic: true

task:
  label_schema: set_piece

data:
  mode: long_videos
  long_video:
    roots:
      - source: xbotgo_0608
        videos_dir: /mnt/data_16t/football/raw_video_720P
        annotations_dir: /home/new_users/qiuqi/code/football_events_human_repair
    split_files:
      train:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
      val_ratio: 0.2
      seed: 42
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_sampling_mode_by_split:
      train: coverage_balanced
      val: event_ratio
    negative_per_minute_by_split:
      train: 2.0
      val: 0.0
    negative_safety_margin_sec_by_split:
      train: 2.0
      val: 0.0
    negative_label_safety_margin_sec_by_split:
      train:
        shot: 3.0
        save: 3.0
        set_piece: 5.0
      val:
        shot: 0.0
        save: 0.0
        set_piece: 0.0
    negative_candidate_stride_sec: 2.0
    negative_min_start_distance_sec: 2.0
    negative_temporal_bin_sec: 60.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: false
      manifest: ""
      min_score: 0.7
      max_per_video: 0
      safety_margin_sec: 2.0
      include_in_val: false
  num_workers_per_gpu: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 1
  preprocessing:
    normalize_on_device: true

video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size: [384, 640]
  hflip_prob: 0.5
  # Global, ROI-A and ROI-B use three complementary 16-frame timelines.
  dual_sampling: multi_staggered

spatial_crop:
  mode: robust_detector_aware
  index_root: outputs/football_roi_indices/robust_v2
  require_index: true
  drop_missing_index_videos: true
  output_view: dual
  num_rois: 2
  global_image_size: [512, 896]
  temporal_mode: clip
  padding: 0.15
  min_crop_area_ratio: 0.0
  max_crop_area_ratio: 0.35
  min_roi_confidence: 0.40
  goal_conf: 0.40
  person_conf: 0.35
  center_circle_conf: 0.35
  raw_ball_conf: 0.10
  min_goal_frames: 3
  min_ball_points: 5
  max_people: 10
  max_cached_videos: 1
  complementary_max_iou: 0.45
  complementary_min_people: 2
  complementary_shift_ratios: [-0.85, -0.60, 0.60, 0.85]
  noise_augmentation:
    invalid_prob: 0.15
    ball_drop_prob: 0.10
    goal_drop_prob: 0.10
    isolated_false_positive_prob: 0.05
    center_jitter: 0.08
    scale_min: 1.0
    scale_max: 1.0

model:
  backbone: dinov3_vitl16
  weights: /mnt/data_16t/football/qiuqi/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  init_checkpoint: outputs/football_events/vitl16_dual_roi_shared_16f_hr/best.pt
  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: false
  freeze_loaded_backbone: false
  freeze_global_branch: false
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  # Global tokens query the two ROI timelines as detail memory before the
  # original global temporal head performs localization and classification.
  view_fusion: dual_multi_roi_memory
  view_fusion_layers: 1
  view_fusion_heads: 8
  view_fusion_residual_gate_init: 0.02
  roi_count: 2
  roi_meta_dim: 16
  gradient_checkpointing: true
  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 4
    target_modules: [attn.qkv, attn.proj]
    train_norm: false

cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_dual_roi_temporal_memory_safe_neg_16f_hr
  batch_size: 1
  rebuild: false

train:
  epochs: 4
  per_gpu_batch_size: 8
  grad_accum_steps: 2
  lr_per_gpu: 0.000025
  backbone_lr_per_gpu: 0.000002
  weight_decay: 0.05
  pos_weight: [1.0, 2.5, 4.0]
  pos_weight_max: 50.0
  local_loss_weight: 0.0
  # The final fused path is already optimized by clip/frame losses. Avoid
  # duplicating the same classifier loss under an auxiliary name.
  roi_feature_loss_weight: 0.0
  roi_quality_loss_weight: 0.0
  roi_quality_temperature: 0.25
  # Supervise localization on the fused global timeline. Frame ranking remains
  # disabled because point annotations can be temporally biased.
  frame_det_loss_weight: 0.4
  frame_det_loss_type: focal_bce
  frame_heatmap_loss_weight: 0.5
  frame_mil_loss_weight: 0.3
  frame_rank_loss_weight: 0.0
  frame_mil_topk: 3
  frame_eval_topk: 4
  frame_rank_pos_threshold: 0.5
  frame_rank_neg_threshold: 0.05
  frame_rank_margin: 1.0
  frame_label_sigma_sec:
    shot: 0.8
    save: 0.8
    set_piece: 1.5
  frame_label_ignore_radius_sec:
    shot: 3.0
    save: 3.0
    set_piece: 5.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: true
  checkpoint_selection: tuned_macro_precision_at_recall_floor
  checkpoint_min_recall: 0.68
  resume:
    enabled: false
    checkpoint: ""
    strict: true
    load_optimizer: false
    load_scheduler: false
    load_scaler: false

eval:
  threshold: 0.5
  per_gpu_batch_size: 1
  tuned_min_recall:
    shot: 0.84
    save: 0.72
    set_piece: 0.68
