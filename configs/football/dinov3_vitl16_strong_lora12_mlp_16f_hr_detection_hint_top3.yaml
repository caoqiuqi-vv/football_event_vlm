output_dir: outputs/football_events/vitl16_strong_lora12_mlp_16f_hr_detection_hint_top3
device: cuda:0
gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
seed: 42
deterministic: true

task:
  label_schema: set_piece

data:
  mode: long_videos
  long_video:
    roots:
      - source: xbotgo_0608
        videos_dir: /mnt/data_16t/football/raw_video_720P
        annotations_dir: /mnt/data_16t/football/football_events_human_repair
    split_files:
      train:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: false
      manifest: ""
      min_score: 0.0
      max_per_video: 0
      safety_margin_sec: 8.0
      include_in_val: false
  num_workers_per_gpu: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true

video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size: [640, 1120]
  hflip_prob: 0.5

spatial_crop:
  mode: none

detection_hint:
  enabled: true
  index_root: /mnt/data_16t/football/roi_indices/conditional_goal_crowd_v1
  topk_ball: 3
  topk_goal: 1
  ball_conf: 0.10
  goal_conf: 0.40
  ball_marker_scale: 3.0
  ball_min_radius_ratio: 0.006
  ball_max_radius_ratio: 0.025
  ball_alpha: 0.70
  goal_alpha: 0.45
  line_width_ratio: 0.002
  max_frame_gap_sec: 0.35
  raw_rgb_prob: 0.20
  ball_dropout_prob: 0.20
  goal_dropout_prob: 0.20
  center_jitter_ratio: 0.08
  radius_jitter_ratio: 0.12
  max_cached_videos: 2

model:
  backbone: dinov3_vitl16
  weights: checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  init_checkpoint: checkpoints/vitl16_lora_r5_f32_16f_e1_frame_det_last.pt
  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: true
  freeze_loaded_backbone: false
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: cls_transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  view_fusion: single
  gradient_checkpointing: true
  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 12
    target_modules: [attn.qkv, attn.proj, mlp.fc1, mlp.fc2]
    train_norm: true

cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_strong_lora12_mlp_16f_hr_detection_hint_top3
  batch_size: 1
  rebuild: false

train:
  epochs: 6
  # 8 GPUs x 3 samples x 4 accumulation = historical effective batch 96.
  per_gpu_batch_size: 3
  grad_accum_steps: 4
  # Global head/backbone LR stay at 2e-4 / 1.5e-5 for a fair A/B.
  lr_per_gpu: 0.000025
  backbone_lr_per_gpu: 0.000001875
  weight_decay: 0.05
  pos_weight: [1.0, 2.5, 4.0]
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: true
  checkpoint_selection: tuned_macro_precision_at_recall_floor
  checkpoint_min_recall: 0.75
  resume:
    enabled: false
    checkpoint: ""
    strict: true
    load_optimizer: false
    load_scheduler: false
    load_scaler: false
  frame_det_loss_weight: 0.4
  frame_det_loss_type: focal_bce
  frame_heatmap_loss_weight: 0.5
  frame_mil_loss_weight: 0.3
  frame_rank_loss_weight: 0.0
  frame_mil_topk: 3
  frame_eval_topk: 4
  frame_rank_pos_threshold: 0.5
  frame_rank_neg_threshold: 0.05
  frame_rank_margin: 1.0
  frame_label_sigma_sec:
    shot: 0.8
    save: 0.8
    set_piece: 1.5
  frame_label_ignore_radius_sec:
    shot: 3.0
    save: 3.0
    set_piece: 5.0

eval:
  threshold: 0.5
  per_gpu_batch_size: 3
  tuned_min_recall:
    shot: 0.84
    save: 0.78
    set_piece: 0.65
