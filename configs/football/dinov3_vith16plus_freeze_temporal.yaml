output_dir: outputs/football_events/vith16plus_freeze_temporal
device: cuda:0

data:
  roots:
    - /mnt/data/Datasets/Datasets/Football/video_clips_for_vlm/dataset_v3_with_render
    - /mnt/data/Datasets/Datasets/Football/video_clips_for_vlm/dataset_v4
  num_workers: 4
  pin_memory: true

video:
  num_frames: 16
  image_size: 224
  hflip_prob: 0.5

model:
  backbone: dinov3_vith16plus
  weights: ""
  pretrained: true
  freeze_backbone: true
  finetune_last_blocks: 0
  frame_feature_dim: 2560
  temporal_fusion: transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1

cache:
  enabled: true
  dir: outputs/football_dino_features/vith16plus_lvd1689m
  batch_size: 1
  rebuild: false

train:
  epochs: 30
  batch_size: 32
  grad_accum_steps: 1
  lr: 0.0003
  backbone_lr: 0.000005
  weight_decay: 0.05
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20

eval:
  batch_size: 64
