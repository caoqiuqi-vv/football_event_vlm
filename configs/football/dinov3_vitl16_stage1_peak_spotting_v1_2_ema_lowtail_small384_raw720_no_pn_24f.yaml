  tuned_fbeta_beta: 2.0
experiment_notes:
  purpose: V1.2 calibration-stability fine-tune from V1.1-new epoch8 best.pt. Adds
    trainable-parameter EMA, positive low-tail logit margin for shot/save, and stability-aware
    checkpoint selection penalizing low tuned thresholds / low positive p10. Architecture/data/loss
    weights otherwise match V1.1-new.
  init: outputs/football_events/vitl16_stage1_peak_spotting_v1_1_new_small384_raw720_no_pn_24f/best.pt
  primary_metric: long-video recall/precision/manual-review-time; clip val uses stable_tuned_macro_precision_at_recall_floor
    only for checkpoint hygiene.
  no_epoch_weights: save_epoch_checkpoints=false; keep best.pt, last.pt, pre_eval_recovery.pt
    only.
  selection_revision: 'Absolute tuned threshold/positive_p10 penalties disabled after
    review: low thresholds may be the correct high-recall operating point. V1.2 now
    uses EMA + low-tail training for stability, while checkpoint selection falls back
    to recall-floor precision; final decision remains long-video recall/precision/manual-review-time.'
  threshold_search: Use internal 15-video val to tune per-class thresholds by F2 (beta=2.0)
    with recall-floor constraint; this better matches the high-recall operating point
    than precision/F1 thresholding.
  v1_2_real_training_fix: 'Adds positive low-tail BCE mining: per batch/class, reweight
    bottom-25% trusted positive shot/save logits. Raises frame_pos_weight shot/save
    to 4/5 to increase event-frame gradients while keeping set_piece unchanged. This
    targets the trainability bottleneck, unlike EMA/F2 which are selection/evaluation
    fixes.'
