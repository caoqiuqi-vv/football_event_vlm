experiment_notes:
  purpose_e16_grid_dual: >-
    E1.6 (2026-08-27) round-1 supervision fix, single-variable vs
    vitl16_controlled_online_highres720_last6r8: (1) every sampled event
    trains the exact eval-grid window pair (anchor at r and r+5s, r = anchor
    mod 5), closing the [2,3)/[7,8) position blind spot; a canonical 3-7s
    window is kept for stable frame localization. Grid windows keep clip
    weight 1.0; frame weight 0.5 outside the canonical band. (2) online
    evaluation fuses the event score: detection/NMS score and timestamp both
    derive from sigmoid(frame peak) * sigmoid(clip logit). (3) LoRA stays
    frozen (scope temporal_heads); init from the 720p epoch-1 online best.
    No hard FP mining, no eval context-ignore, strict 1:1 tolerance 5s
    unchanged; anchor-position buckets / peak error / near-duplicate FP /
    2s-localization recall are added as diagnostics only.
  init_protocol: Warm-start from
    vitl16_controlled_online_highres720_last6r8/best.pt (epoch-1 EMA online
    best); fresh optimizer/scheduler/EMA; LoRA frozen (temporal_heads only).
  learning_rate_protocol: Identical to the 720p controlled run (lr 1.25e-5,
    temporal 1.25e-5, head 1.875e-5, evidence 6.25e-6/9.375e-6 per GPU);
    LoRA LR irrelevant while frozen.
  effective_batch: 10 per GPU x 4 DDP ranks x 2 accumulation = 80 (2 event
    groups per micro-batch; raised from 60 for GPU efficiency, LR unchanged)
  acceptance_criteria: >-
    vs 720p epoch-1 baseline (shot P 0.2945 / R 0.8518, FP 757, selection
    0.33663): shot P@R85 above 0.2945 with FP below 757; anchor bucket
    [2,3) recall clearly improved; peak error P90 and near-duplicate FP
    down; save/set_piece AP not degraded; online selection score > 0.33663.
