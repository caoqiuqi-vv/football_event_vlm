cache:
  batch_size: 1
  dir: outputs/football_dino_features/vitl16_spatial_attn_multilayer_readout_r16_16f_hr
  enabled: false
  rebuild: false
data:
  cpu_thread_env: 1
  long_video:
    auto_split:
      enabled: false
      seed: 42
      val_ratio: 0.2
    hard_negative:
      enabled: false
      include_in_val: false
      manifest: ''
      max_per_video: 0
      min_score: 0.0
      safety_margin_sec: 8.0
    negative_min_events_per_label: 4
    negative_per_video: 0
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_require_all_labels: false
    roots:
    - annotations_dir: /home/new_users/qiuqi/code/football_events_human_repair
      source: xbotgo_0608
      videos_dir: /mnt/data_16t/football/raw_video_720P
    split_files:
      train:
      - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
      - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
  mode: long_videos
  num_workers_per_gpu: 1
  opencv_num_threads: 0
  persistent_workers: true
  pin_memory: true
  prefetch_factor: 1
  preprocessing:
    normalize_on_device: true
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
deterministic: true
device: cuda:0
eval:
  per_gpu_batch_size: 6
  threshold: 0.5
  tuned_min_recall:
    save: 0.78
    set_piece: 0.65
    shot: 0.84
gpu_ids:
- 0
- 1
- 2
- 3
model:
  backbone: dinov3_vitl16
  dropout: 0.1
  finetune_last_blocks: 0
  frame_feature_dim: 8192
  frame_feature_layers:
  - -12
  - -8
  - -4
  - -1
  frame_feature_mode: multi_layer_cls_patch_attn
  frame_patch_pool: attn
  freeze_backbone: true
  freeze_global_branch: false
  freeze_loaded_backbone: false
  gradient_checkpointing: true
  hidden_dim: 512
  init_checkpoint: outputs/football_events/vitl16_temporal_spatial_attention_v2_region_only_16f_hr/best.pt
  init_checkpoint_strict: false
  lora:
    alpha: 32
    dropout: 0.05
    enabled: true
    rank: 16
    target_last_blocks: 12
    target_modules:
    - attn.qkv
    - attn.proj
    - mlp.fc1
    - mlp.fc2
    train_norm: true
  pretrained: true
  spatial_attention:
    attention_dim: 256
    context_layers: 1
    enabled: true
    gate_init: 0.5
    num_heads: 8
    queries_per_class: 2
    return_attention_maps: false
    temporal_layers: 2
  temporal_fusion: cls_transformer
  temporal_heads: 8
  temporal_layers: 4
  view_fusion: single
  weights: /mnt/data_16t/football/qiuqi/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
output_dir: outputs/football_events/vitl16_spatial_attn_multilayer_readout_r16_16f_hr
seed: 42
spatial_crop:
  mode: none
task:
  label_schema: set_piece
train:
  amp: true
  amp_dtype: bf16
  backbone_lr_per_gpu: 1.25e-06
  checkpoint_min_recall: 0.75
  checkpoint_selection: tuned_macro_precision_at_recall_floor
  epochs: 15
  frame_det_loss_weight: 0.0
  global_backbone_lr: 5.0e-06
  grad_accum_steps: 2
  grad_clip_norm: 1.0
  local_backbone_lr: 5.0e-06
  log_interval: 20
  lr_per_gpu: 1.25e-05
  per_gpu_batch_size: 6
  pos_weight:
  - 1.0
  - 2.5
  - 4.0
  pos_weight_max: 50.0
  positive_retention_branch: fused
  positive_retention_loss_weight: 0.1
  positive_retention_margin: 0.0
  resume:
    checkpoint: ''
    enabled: false
    load_optimizer: false
    load_scaler: false
    load_scheduler: false
    strict: true
  save_epoch_checkpoints: true
  spatial_attention_concentration_loss_weight: 0.1
  spatial_attention_entropy_target: 0.85
  spatial_attention_mil_loss_weight: 0.5
  spatial_attention_mil_topk: 3
  spatial_attention_overlap_loss_weight: 0.05
  spatial_attention_query_diversity_loss_weight: 0.01
  weight_decay: 0.05
video:
  clip_duration: 10.0
  event_margin: 1.0
  hflip_prob: 0.5
  image_size:
  - 640
  - 1120
  num_frames: 16
  temporal_jitter_sec: 1.5
