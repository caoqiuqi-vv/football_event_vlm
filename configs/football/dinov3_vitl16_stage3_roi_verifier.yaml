output_dir: outputs/football_events/vitl16_stage3_roi_verifier
device: cuda:0
gpu_ids: [0, 1, 2, 3]
seed: 42
deterministic: true

task:
  label_schema: set_piece

data:
  mode: long_videos
  long_video:
    roots:
      - source: xbotgo_0608
        videos_dir: /mnt/data_16t/football/raw_video_720P
        annotations_dir: /home/new_users/qiuqi/code/football_events_human_repair
    split_files:
      train:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
      val_ratio: 0.2
      seed: 42
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: false
      manifest: ''
      min_score: 0.55
      max_per_video: 12
      safety_margin_sec: 5.0
      include_in_val: false
  num_workers_per_gpu: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true

video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  # ROI branch resolution. Both dimensions are multiples of ViT-L/16 patch size.
  image_size: [512, 896]
  hflip_prob: 0.5

spatial_crop:
  mode: robust_detector_aware
  index_root: outputs/football_roi_indices/robust_v2
  require_index: true
  drop_missing_index_videos: true
  output_view: dual
  # Frozen global branch preserves the stage-2 input resolution.
  global_image_size: [640, 1120]
  padding: 0.15
  min_crop_area_ratio: 0.0
  max_crop_area_ratio: 0.60
  min_roi_confidence: 0.40
  goal_conf: 0.40
  person_conf: 0.35
  center_circle_conf: 0.35
  raw_ball_conf: 0.10
  min_goal_frames: 3
  min_ball_points: 5
  max_people: 10
  max_cached_videos: 2
  noise_augmentation:
    invalid_prob: 0.15
    ball_drop_prob: 0.10
    goal_drop_prob: 0.10
    isolated_false_positive_prob: 0.05
    center_jitter: 0.08
    scale_min: 1.0
    scale_max: 1.0

model:
  backbone: dinov3_vitl16
  weights: /mnt/data_16t/football/qiuqi/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  # Override this with the accepted stage-2 best checkpoint.
  init_checkpoint: outputs/football_events/vitl16_stage2_single_hr_hardneg_last4_cls_transformer/best.pt
  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: true
  freeze_loaded_backbone: true
  freeze_global_branch: true
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: cls_transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  view_fusion: dual_verifier
  roi_meta_dim: 16
  # roi_meta[:, 1] is roi_confidence. Below this value fused == global exactly.
  roi_verifier_min_confidence: 0.60
  gradient_checkpointing: false
  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 4
    target_modules: [attn.qkv, attn.proj]
    train_norm: false

cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_stage3_roi_verifier
  batch_size: 1
  rebuild: false

train:
  epochs: 3
  per_gpu_batch_size: 1
  grad_accum_steps: 16
  lr: 0.0001
  weight_decay: 0.05
  pos_weight: [1.0, 2.5, 4.0]
  pos_weight_max: 50.0
  # The ROI is a residual verifier, not an independent event classifier.
  local_loss_weight: 0.0
  positive_retention_loss_weight: 1.0
  positive_retention_margin: 0.0
  roi_quality_loss_weight: 0.0
  frame_det_loss_weight: 0.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: true
  checkpoint_selection: default_precision_at_recall_floor
  checkpoint_min_recall: 0.60
  resume:
    enabled: false
    checkpoint: ''
    strict: true
    load_optimizer: false
    load_scheduler: false
    load_scaler: false

eval:
  threshold: 0.5
  per_gpu_batch_size: 1
