experiment_notes:
  purpose: V1.3 curriculum fine-tune from V1.1-new epoch8 best.pt. Fixes V1.2 multi-objective
    conflict by learning clip semantics first, then weak dense/frame localization,
    then high-recall low-tail/rank refinement.
  init: outputs/football_events/vitl16_stage1_peak_spotting_v1_1_new_small384_raw720_no_pn_24f/best.pt
  stage_policy: Stage1 epochs 1-5 clip-first; Stage2 epochs 6-10 dense/frame ramp;
    Stage3 epochs 11-20 high-recall refinement. Early stopping disabled to force full
    curriculum completion.
  primary_metric: 18-video long-video recall/precision/manual-review-time; clip-val
    tuned macro F2 @ recall floor 0.88 is checkpoint hygiene only.
  v12_diagnosis: 'V1.2 improved in epoch2 but regressed at epoch3: train_loss 0.693,
    mAP 0.5468, low-tail/gap deterioration; therefore do not continue V1.2.'
  checkpoint_policy: save_epoch_checkpoints=false; keep best.pt, last.pt, pre_eval_recovery.pt
    only.
  stage2_resume_protocol: 'True curriculum handoff: resume epoch-5 Stage1 last.pt
    with optimizer/scheduler/scaler/EMA; start_epoch=6; physical GPUs 4-7 mapped to
    logical 0-3.'
  stage2_batch_protocol: per_gpu_batch=6 x 4 GPUs x grad_accum=3 = effective batch
    72, exactly matching Stage1 effective batch 72.
  io_tuning: 'num_workers_per_gpu=3 and prefetch_factor=2 retained after measurement:
    four total workers made the first batch exceed two minutes; Stage1 historical
    data_time was 4-5s with higher concurrency. Duration cache and constructor-level
    timeouts remain enabled.'
