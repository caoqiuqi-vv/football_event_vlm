output_dir: outputs/football_events/videomaev2_vitb_k710_16f_4s_dense_224x384_global_temporal_aux_v4
device: cuda:0
gpu_ids: [0, 1, 2, 3]
seed: 42
deterministic: true

task:
  label_schema: set_piece

data:
  mode: long_videos
  long_video:
    roots:
      - source: xbotgo_0608
        videos_dir: /mnt/data_16t/football/raw_video_720P
        annotations_dir: /mnt/data_16t/football/football_events_human_repair
    split_files:
      train:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: false
      manifest: ""
      min_score: 0.0
      max_per_video: 0
      safety_margin_sec: 8.0
      include_in_val: false
  num_workers_per_gpu: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true

video:
  num_frames: 16
  clip_duration: 10.0
  # Preserve the same 10-second candidate records, but sample the actual 16
  # input frames from a dense 4-second nested window (~4 fps).
  sampling_duration: 4.0
  sampling_temporal_jitter_sec: 0.5
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size: [224, 384]
  hflip_prob: 0.5

spatial_crop:
  mode: none

detection_hint:
  enabled: false

model:
  backbone: videomaev2_vitb16
  weights: /home/new_users/qiuqi/code/VideoMAEv2/model_zoo/vit_b_k710_dl_from_giant.pth
  pretrained: true
  # Continue the same model at the epoch-4 gate.  Only the objective changes,
  # so strict loading proves this is a causal supervision ablation rather than
  # a fresh random-head experiment.
  init_checkpoint: /home/new_users/qiuqi/code/dinov3-main/outputs/football_events/videomaev2_vitb_k710_16f_224x384_global_temporal_aux_v3/best.pt
  init_checkpoint_strict: true
  freeze_backbone: true
  finetune_last_blocks: 4
  frame_feature_mode: last_cls_patch_mean
  frame_feature_dim: 1536
  temporal_fusion: videomae_residual_transformer
  hidden_dim: 512
  temporal_layers: 2
  temporal_heads: 8
  dropout: 0.1
  view_fusion: single
  gradient_checkpointing: true
  videomaev2:
    source_root: /home/new_users/qiuqi/code/VideoMAEv2
    tubelet_size: 2
    drop_path_rate: 0.05
    preserve_global_feature: true
    temporal_gate_init: 0.25
  lora:
    enabled: false

cache:
  enabled: false
  dir: outputs/football_videomaev2_features/vitb_k710_16f_224x384_global_temporal_aux_v3
  batch_size: 1
  rebuild: false

train:
  # Dense-sampling adaptation from the fully trained sparse-sampling best.
  epochs: 8
  per_gpu_batch_size: 12
  grad_accum_steps: 2
  lr_per_gpu: 0.000025
  backbone_lr_per_gpu: 0.00000125
  weight_decay: 0.05
  pos_weight: [1.0, 2.5, 4.0]
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: true
  checkpoint_selection: tuned_macro_precision_at_recall_floor
  checkpoint_min_recall: 0.75
  global_action_aux_loss_weight: 0.3
  # The v2 fused objective lets the global path absorb all gradients and the
  # temporal residual decays toward zero.  Direct BCE makes the temporal path
  # independently predict each event; evaluation reports temporal_only,
  # global_action and global_plus_temporal separately.
  temporal_branch_aux_loss_weight: 0.5
  early_stopping:
    enabled: true
    monitor: tuned_mAP
    min_epoch: 2
    patience: 3
    min_delta: 0.002
  resume:
    enabled: false
    checkpoint: ""
    strict: true
    load_optimizer: true
    load_scheduler: true
    load_scaler: true
  frame_det_loss_weight: 0.25
  frame_det_loss_type: focal_bce
  frame_pos_weight: [2.0, 3.0, 4.0]
  frame_heatmap_loss_weight: 0.5
  frame_mil_loss_weight: 0.3
  frame_rank_loss_weight: 0.0
  frame_mil_topk: 3
  frame_eval_topk: 4
  frame_rank_pos_threshold: 0.5
  frame_rank_neg_threshold: 0.05
  frame_rank_margin: 1.0
  frame_label_sigma_sec:
    shot: 0.8
    save: 0.8
    set_piece: 1.5
  frame_label_ignore_radius_sec:
    shot: 3.0
    save: 3.0
    set_piece: 5.0

eval:
  threshold: 0.5
  per_gpu_batch_size: 12
  tuned_min_recall:
    shot: 0.84
    save: 0.78
    set_piece: 0.65
