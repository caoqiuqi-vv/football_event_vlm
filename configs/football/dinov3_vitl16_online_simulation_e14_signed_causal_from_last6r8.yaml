experiment_notes:
  purpose_e14_signed_causal_local: >-
    E1.4 (2026-08-26): fixes online central/edge geometry, preserves per-class clean-negative masks, repairs per-class diagnostic alignment, and makes cross-window supervision pair-only with L1 and one-frame matching. Unsigned saliency rank is disabled because strong local evidence also occurs in negatives. A signed causal objective compares a frozen-downstream local-patch path against a detached global-only counterfactual; global context is stop-gradient and adapter/temporal/classifier parameters are functional-frozen so only patch routing/values receive this auxiliary gradient: local evidence must raise the correct positive class and lower only per-class trusted negatives.
  init_protocol: Warm-start from the validated last6/r8 ep8 best checkpoint; fresh
    optimizer/scheduler/EMA. last8 is not used because it has not beaten last6 on
    the agreed long-video protocol.
  learning_rate_protocol: >-
    Protect the validated last6 representation after E1.2 over-adaptation:
    LoRA global 1e-6; evidence local/temporal global 2.5e-5; evidence classifier global 3.75e-5.
  fixed_variables: Architecture, 24f 512x896 input, last6/r8 LoRA, train/val splits and base clip/frame objectives match the validated last6 baseline. E1.4 changes only the audited online geometry, mask semantics, cross-window matching and local-evidence objective; no detector auxiliary, HQ switch, HN mining, pseudo-anchor, save conditioning or V3 supervision.
  decision_gate: Judge epoch1 first by data/loss invariants (central and edge geometry preserved, signed positive and negative slots nonzero, positive and negative causal gaps moving above zero, paired cross-window matched frames nonzero and gap decreasing), then by Val15 mixed selection and cached External18 online precision-recall-participation Pareto. Do not use frozen no-evidence mass or unsigned saliency gap as success criteria.
  effective_batch: 4 per GPU x 4 DDP ranks x 4 accumulation = 64
  checkpoint_policy: best.pt + last.pt only
  threshold_policy_update_20260826: >-
    Future threshold tuning/checkpoint selection uses
    per-class mixed objectives: shot maximizes precision subject to recall>=0.85;
    save and set_piece maximize exact tuned F1 without a recall floor. Never encode
    the latter as a zero recall floor under a max-precision objective. Training-time
    External18 audit is disabled; cached online predictions are rescored offline.
