output_dir: outputs/football_events/vitl16_new_lvd1689m_long_set_piece_160video_freeze_temporal
# Global device for model.to(); gpu_ids enables DataParallel when more than one id is listed.
device: cuda:0
gpu_ids: [0, 1]
seed: 42
deterministic: true

task:
  label_schema: set_piece

data:
  mode: long_videos
  long_video:
    roots:
      - source: human_repair
        videos_dir: /code/raw_video_720P
        annotations_dir: /code/football_events_human_repair
    split_files:
      train:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
        - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
      val_ratio: 0.2
      seed: 42
    negative_ratio: 0.5
    negative_per_video: 0
    # Keep negatives from sparse videos; label_mask ignores only untrusted classes.
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: false
      manifest: ""
      min_score: 0.7
      max_per_video: 20
      safety_margin_sec: 2.0
      include_in_val: false
  num_workers: 16
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true

video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size: [384, 640]
  hflip_prob: 0.5

spatial_crop:
  mode: none

model:
  backbone: dinov3_vitl16
  weights: /mnt/data_16t/football/qiuqi/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  pretrained: true
  freeze_backbone: true
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1

cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_lvd1689m_long_set_piece_160video_freeze
  batch_size: 2
  rebuild: false

train:
  epochs: 30
  # Global batch size. With two GPUs this is about 8 clips/GPU.
  batch_size: 64
  grad_accum_steps: 2
  lr: 0.0006
  backbone_lr: 0.00002
  weight_decay: 0.05
  # Fixed across ratio ablations so more negatives are not cancelled by neg/pos reweighting.
  pos_weight: [1.0, 1.0, 1.0]
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 10
  save_epoch_checkpoints: false
  resume:
    enabled: true
    # If enabled and checkpoint is empty, defaults to `${output_dir}/last.pt`.
    checkpoint: outputs/football_events/vitb16_8aa4cbdd_long_set_piece_160video_freeze_temporal/epoch_8.pt
    strict: true
    load_optimizer: true
    load_scheduler: true
    load_scaler: true

eval:
  threshold: 0.5
  batch_size: 16
