      window_stride_sec: 5.0
      nms_radius_sec: 5.0
      tolerance_sec: 5.0
      capped_clip_sec: 10.0
experiment_notes:
  purpose_e15_tail_sep_lora: >-
    E1.5 (2026-08-27): head-only training has hit a plateau; the main failure
    remains the low-confidence positive tail (tail_gap ~ -0.29/-0.45/-0.60 on
    E1.4). E1.5 tests ONLINE TAIL SEPARATION + LoRA representation adaptation:
    (1) last6 LoRA is switched on at the protected low LR (1e-6 global) so the
    representation can adapt instead of the head alone; (2) every class
    dynamically pairs the weakest trusted positives (per video, batch fallback)
    against the strongest trusted negatives and optimizes
    softplus(margin + top_neg - bottom_pos) - no fixed random pair ranking, no
    event-time anchor, only label_mask>0 rows; (3) an EMA teacher (fresh for
    this run, anchored at the epoch1 head-only best) constrains the student not
    to drop trusted positive logits; (4) checkpoint selection is per-class
    precision subject to recall floors: shot P@R>=0.85, save P@R>=0.70,
    set_piece P@R>=0.70.
  init_protocol: Warm-start from the head-only E1.4 epoch-1 best
    (epoch1_full_consistency/best.pt); fresh optimizer/scheduler/EMA; no resume.
  learning_rate_protocol: >-
    All trainable LRs halved vs E1.4 continue4: lr 6.25e-6, temporal 6.25e-6,
    head 9.375e-6 per GPU; class_evidence local/temporal 3.125e-6, classifier
    4.6875e-6. LoRA stays at backbone_lr 2.5e-7 per GPU (1e-6 global). The
    head-only shot capability must not regress (EMA retention + halved LRs).
  fixed_variables: Architecture, 24f 512x896 input, last6/r8 LoRA, train/val splits, base clip/frame objectives and E1.4 online geometry (central/edge/near/clean, signed causal, cross-window L1) match E1.4 continue4. E1.5 adds LoRA adaptation + tail-separation pairing + EMA retention and changes only checkpoint selection.
  success_criteria: >-
    Primary: tail separation gap (bottom-pos vs top-neg) moves above zero and
    violation_fraction falls while shot P@R>=0.85 is maintained; EMA retention
    gap stays >= ~0. Secondary: macro_f1 / online_event micro_f1 on Val15 and
    cached External18 do not regress vs E1.4. First round runs 512x896 for
    1-2 epochs; only if tail separation works, migrate to 720x1280.
  decision_gate: >-
    Judge after epoch1: tail_separation_gap per class above 0,
    violation_fraction decreasing, bottom_positive_logit rising, retention gap
    non-negative, then Val15 per-class P@R (shot >=0.85, save >=0.70,
    set_piece >=0.70).
  effective_batch: 4 per GPU x 4 DDP ranks x 4 accumulation = 64
  checkpoint_policy: best.pt + last.pt only
  threshold_policy_update_20260827: >-
    E1.5 switches the whole selection to per-class max-precision subject to
    recall floors: shot 0.85, save 0.70, set_piece 0.70. This supersedes the
    E1.4 mixed policy (save/set_piece F1). Training-time External18 audit
    stays disabled; cached online predictions are rescored offline.
