  class_evidence_saliency_rank_weight: 0.0
  class_evidence_saliency_rank_margin: 0.10
  class_evidence_saliency_rank_topk: 3
  class_evidence_saliency_rank_support_threshold: 0.1
  class_evidence_saliency_rank_pairs_per_positive: 2
  # Pair-only, absolute-time local-routing consistency. L1 avoids the tiny
  # squared-gradient regime observed in E1.3.2.
  class_evidence_cross_window_weight: 0.05
  class_evidence_cross_window_tolerance_sec: 0.24
