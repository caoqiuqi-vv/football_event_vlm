  class_evidence_local_lr_per_gpu: 3.125e-06
  class_evidence_temporal_lr_per_gpu: 3.125e-06
  class_evidence_head_lr_per_gpu: 4.6875e-06
  # Frame-level null-mass supervision stays disabled: a non-event frame may
  # still contain strong football evidence. The frozen gate is diagnostic only.
  class_evidence_no_evidence_loss_weight: 0.0
  class_evidence_gate_lr_per_gpu: 1.25e-03
