  # refute only the per-class trusted negatives. The counterfactual retains
  # identical global context and removes patch appearance/motion only.
  class_evidence_signed_causal_loss_weight: 0.05
  class_evidence_signed_causal_positive_margin: 0.15
  class_evidence_signed_causal_negative_margin: 0.10
  class_evidence_signed_causal_negative_weight: 0.5
