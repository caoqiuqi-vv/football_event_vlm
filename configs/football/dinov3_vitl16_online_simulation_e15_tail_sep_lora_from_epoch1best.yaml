  # head-only shot capability. One extra no-grad forward per micro-batch.
  ema_positive_retention_weight: 0.10
  ema_positive_retention_margin: 0.05
  ema_positive_retention_temperature: 0.5
  ema_positive_retention_labels:
  - shot
  - save
  - set_piece
  class_evidence_no_evidence_balance: per_class_equal_event_background
  event_min_target: 0.5
  background_max_target: 0.1
  require_both_sides_per_class: true
  global_ddp_balance: true
  frame_heatmap_aggregation: per_positive_core_context
  frame_heatmap_core_min_target: 0.5
  frame_heatmap_context_max_target: 0.1
  class_evidence_query_diversity_loss_weight: 0.0
  class_evidence_counterfactual_loss_weight: 0.0
  ddp_find_unused_parameters: false
  online_pair_consistency:
