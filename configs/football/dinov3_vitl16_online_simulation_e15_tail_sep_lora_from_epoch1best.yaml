  tail_separation_loss_weight: 0.10
  tail_separation_margin: 0.15
  tail_separation_positive_quantile: 0.25
  tail_separation_negative_quantile: 0.25
  tail_separation_min_positive: 2
  tail_separation_min_negative: 2
