experiment_notes:
  purpose_e12a: 'Corrected online-simulation single-variable audit: dynamic 40s chunks
    each epoch; class/video/event-balanced event sampling; exact 10s stride5 windows;
    full clip existence supervision on boundary positives; frame-only boundary downweight;
    distance-aware near-event ignore/half-weight; per-class equal positive-negative
    clip BCE.'
  init_protocol: Warm-start from the validated last6/r8 ep8 best checkpoint; fresh
    optimizer/scheduler/EMA. last8 is not used because it has not beaten last6 on
    the agreed long-video protocol.
  learning_rate_protocol: 'Warm-start LRs are 4x lower than the original from-pretrained
    run: global LoRA 1e-5; evidence local/temporal 5e-5; evidence head 7.5e-5.'
  fixed_variables: Architecture, 24f 512x896 input, last6/r8 LoRA, losses and train/val
    splits match the validated last6 baseline. No consistency loss, detector auxiliary,
    HQ switch, HN mining, pseudo-anchor, save conditioning or V3 supervision in E1.2-A.
  decision_gate: Judge epoch1-2 by Val15 selection plus External18 online event metrics.
    Continue only if recall/precision participation Pareto does not regress versus
    last6 baseline.
  effective_batch: 4 per GPU x 4 DDP ranks x 4 accumulation = 64
  checkpoint_policy: best.pt + last.pt only
  threshold_policy_update_20260826: Future threshold tuning/checkpoint selection uses
    shot>=0.85, save>=0.80, set_piece>=0.80. The active process loaded 0.85/0.85/0.85;
    its cached epoch outputs must be rescored offline under 0.85/0.80/0.80 without
    retraining.
