      safety_margin_sec: 2.0
      temporal_jitter_sec: 0.25
      repeat_factor: 1
      loss_weight: 4.0
      include_in_val: false
  num_workers_per_gpu: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true
video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size:
  - 512
  - 896
  hflip_prob: 0.5
  candidate_num_frames: 32
spatial_crop:
  mode: none
model:
  backbone: dinov3_vitl16
  weights: checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
