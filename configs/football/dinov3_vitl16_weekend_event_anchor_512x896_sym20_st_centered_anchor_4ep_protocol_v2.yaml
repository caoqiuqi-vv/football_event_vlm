  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: true
  freeze_loaded_backbone: false
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: event_anchor_transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  view_fusion: single
  gradient_checkpointing: true
  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 4
    target_modules:
    - attn.qkv
    - attn.proj
    train_norm: false
  context_frames: 4
  event_topk_gradient: straight_through
  event_topk_temperature: 1.0
  event_topk_gradient_scale: 0.25
  event_anchor_topk_per_class:
    shot: 2
    save: 2
    set_piece: 1
  event_anchor_class_indices:
  - 0
  - 1
  - 2
  event_anchor_offsets:
  - -1
  - 0
  - 1
  event_anchor_nms_radius: 2
  event_anchor_max_frames: 20
cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_lora_r5_f32_16f_hr_single_frame_det
  batch_size: 1
  rebuild: false
train:
  epochs: 4
  per_gpu_batch_size: 2
  grad_accum_steps: 24
  lr_per_gpu: 2.0e-05
  backbone_lr_per_gpu: 2.0e-06
  weight_decay: 0.05
  pos_weight:
  - 1.0
  - 2.5
  - 4.0
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: true
  checkpoint_selection: default_precision_at_recall_floor
  checkpoint_min_recall: 0.6
  resume:
    enabled: false
    checkpoint: ''
    strict: true
    load_optimizer: false
    load_scheduler: false
    load_scaler: false
  frame_det_loss_weight: 0.5
  frame_det_loss_type: focal_bce
  frame_heatmap_loss_weight: 0.5
  frame_mil_loss_weight: 0.3
  frame_rank_loss_weight: 0.2
  frame_mil_topk: 3
  frame_eval_topk: 4
  frame_rank_pos_threshold: 0.5
  frame_rank_neg_threshold: 0.05
  frame_rank_margin: 1.0
  frame_label_sigma_sec:
    shot: 0.8
    save: 0.8
    set_piece: 1.5
  frame_label_ignore_radius_sec:
    shot: 3.0
    save: 3.0
    set_piece: 5.0
  hard_negative_rank_loss_weight: 0.0
  hard_negative_rank_branch: fused
  hard_negative_rank_margin: 0.6
  hard_negative_rank_labels:
  - shot
  - save
  online_hard_negative_loss_weight: 0.0
  online_hard_negative_rank_loss_weight: 0.0
eval:
  threshold: 0.5
  per_gpu_batch_size: 2
