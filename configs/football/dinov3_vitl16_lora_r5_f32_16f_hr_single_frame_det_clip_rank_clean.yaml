output_dir: outputs/football_events/vitl16_e1_clip_rank_clean_lora
device: cuda:0
gpu_ids:
- 0
- 1
seed: 42
deterministic: true
task:
  label_schema: set_piece
data:
  mode: long_videos
  long_video:
    roots:
    - source: xbotgo_0608
      videos_dir: /mnt/data_16t/football/raw_video_720P
      annotations_dir: /home/new_users/qiuqi/code/football_events_human_repair
    split_files:
      train:
      - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/train_video_ids.txt
      val:
      - configs/football/splits/vitl16_lvd1689m_set_piece_seed42_162videos/val_video_ids.txt
    auto_split:
      enabled: false
      val_ratio: 0.2
      seed: 42
    negative_ratio: 5.0
    negative_ratio_by_split:
      train: 5.0
      val: 2.0
    negative_per_video: 0
    negative_require_all_labels: false
    negative_min_events_per_label: 4
    hard_negative:
      enabled: true
      manifest: outputs/football_hard_negatives/pointnms_fp_clean_shot_save.json
      min_score: 0.0
      max_per_video: 12
      safety_margin_sec: 10.0
      repeat_factor: 1
      loss_weight: 1.0
      temporal_jitter_sec: 0.25
      include_in_val: false
  num_workers_per_gpu: 1
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 1
  opencv_num_threads: 0
  cpu_thread_env: 1
  video_decode_strategy: single_seek
  video_reader_cache_size: 2
  preprocessing:
    normalize_on_device: true
video:
  num_frames: 16
  clip_duration: 10.0
  event_margin: 1.0
  temporal_jitter_sec: 1.5
  image_size:
  - 640
  - 1120
  hflip_prob: 0.5
spatial_crop:
  mode: none
model:
  backbone: dinov3_vitl16
  weights: /mnt/data_16t/football/qiuqi/checkpoints/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth
  init_checkpoint: /mnt/data_16t/football/qiuqi/checkpoints/vitl16_lora_r5_f32_16f_e1_frame_det_last.pt
  init_checkpoint_strict: false
  pretrained: true
  freeze_backbone: false
  freeze_loaded_backbone: false
  finetune_last_blocks: 0
  frame_feature_dim: 2048
  temporal_fusion: cls_transformer
  hidden_dim: 512
  temporal_layers: 4
  temporal_heads: 8
  dropout: 0.1
  view_fusion: single
  gradient_checkpointing: true
  lora:
    enabled: true
    rank: 8
    alpha: 16
    dropout: 0.05
    target_last_blocks: 4
    target_modules:
    - attn.qkv
    - attn.proj
    train_norm: false
cache:
  enabled: false
  dir: outputs/football_dino_features/vitl16_lora_r5_f32_16f_hr_single_frame_det
  batch_size: 1
  rebuild: false
train:
  epochs: 4
  per_gpu_batch_size: 4
  grad_accum_steps: 5
  lr_per_gpu: 7.5e-05
  backbone_lr_per_gpu: 7.5e-06
  weight_decay: 0.05
  pos_weight:
  - 1.0
  - 2.5
  - 4.0
  pos_weight_max: 50.0
  grad_clip_norm: 1.0
  amp: true
  amp_dtype: bf16
  log_interval: 20
  save_epoch_checkpoints: true
  checkpoint_selection: tuned_macro_precision_at_recall_floor
  checkpoint_min_recall: 0.6
  resume:
    enabled: false
    checkpoint: ''
    strict: true
    load_optimizer: true
    load_scheduler: true
    load_scaler: true
  frame_det_loss_weight: 0.5
  frame_det_loss_type: focal_bce
  frame_heatmap_loss_weight: 0.5
  frame_mil_loss_weight: 0.3
  frame_rank_loss_weight: 0.0
  frame_mil_topk: 3
  frame_eval_topk: 4
  frame_rank_pos_threshold: 0.5
  frame_rank_neg_threshold: 0.05
  frame_rank_margin: 1.0
  frame_label_sigma_sec:
    shot: 0.8
    save: 0.8
    set_piece: 1.5
  frame_label_ignore_radius_sec:
    shot: 3.0
    save: 3.0
    set_piece: 5.0
  clip_loss_type: bce
  hard_negative_rank_loss_weight: 0.12
  hard_negative_rank_branch: fused
  hard_negative_rank_labels:
  - shot
  - save
  hard_negative_rank_margin: 0.5
  online_hard_negative_loss_weight: 0.0
  online_hard_negative_rank_loss_weight: 0.0
eval:
  threshold: 0.5
  per_gpu_batch_size: 2
  tuned_min_recall:
    shot: 0.8
    save: 0.65
    set_piece: 0.6
