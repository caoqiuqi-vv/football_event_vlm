<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>射门/角球漏标片段</title><style>
:root{--bg:#0c1420;--panel:#141f2d;--line:#2c3d50;--text:#edf5ff;--muted:#91a4ba;--blue:#4ca7ff;--red:#ff7272;--purple:#c688ff;--green:#42d392}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{height:78px;padding:10px 14px;background:#101b28;border-bottom:1px solid var(--line)}h1{font-size:18px;margin:0 0 8px}.toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap}select,button,label{background:#1d2b3c;color:var(--text);border:1px solid #40536a;border-radius:7px;padding:6px 9px}button{cursor:pointer}.pill{background:#223249;border-radius:20px;padding:5px 9px}.layout{height:calc(100% - 78px);display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:9px;padding:9px}.left{min-width:0;display:flex;flex-direction:column;gap:8px}.head{height:45px;display:flex;align-items:center;gap:8px;background:var(--panel);padding:7px;border:1px solid var(--line);border-radius:9px}.head .grow{flex:1}.videoWrap{flex:1;min-height:0;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}.videoWrap video{width:100%;height:100%;object-fit:contain}.info{min-height:95px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.tag{font-size:16px;font-weight:800;border-radius:8px;padding:7px 11px}.shot{background:#6c292d;color:#ffb5b5}.corner{background:#482967;color:#deb8ff}.right{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}.rightTitle{padding:10px;border-bottom:1px solid var(--line)}.list{overflow-y:auto;flex:1}.item{padding:10px;border-bottom:1px solid #253648;cursor:pointer}.item:hover,.item.active{background:#21344a}.item.active{box-shadow:inset 4px 0 var(--blue)}.meta{font-size:11px;color:var(--muted);margin-top:5px}.mini{display:inline-block;font-size:11px;margin-right:4px;padding:2px 5px;border-radius:5px}.empty{padding:30px;color:var(--muted);text-align:center}.ok{color:var(--green)}@media(max-width:850px){html,body{overflow:auto}.layout{display:block;height:auto}.left{height:720px}.right{height:500px;margin-top:8px}}
</style></head><body><header><h1>Test18 · 射门/角球漏标片段</h1><div class="toolbar"><select id="label"><option value="">全部类别</option><option value="shot">仅射门</option><option value="corner">仅角球</option><option value="multi">射门+角球</option></select><select id="video"><option value="">全部视频</option></select><label><input id="auto" type="checkbox" checked> 自动播放</label><label><input id="autoNext" type="checkbox"> 播完下一条</label><span id="stats" class="pill"></span><span class="pill">←/→ 上下条 · 空格播放</span></div></header><main class="layout"><section class="left"><div class="head"><button onclick="move(-1)">← 上一条</button><button onclick="move(1)">下一条 →</button><b id="position" class="grow">—</b><button onclick="replay()">从头播放</button></div><div class="videoWrap"><video id="player" controls playsinline preload="auto"></video></div><div id="info" class="info"><div class="empty">选择右侧片段开始播放</div></div></section><aside class="right"><div class="rightTitle"><b>漏标片段列表</b><div class="meta">只读展示 · 原始分辨率 · 无重编码</div></div><div id="list" class="list"></div></aside></main><script>
const TOKEN=new URLSearchParams(location.search).get('token')||'';let DATA,shown=[],current=-1;const zh={shot:'射门',corner:'角球'};const fmt=t=>{let m=Math.floor(t/60),s=(t-m*60).toFixed(3).padStart(6,'0');return `${m}:${s}`};
async function boot(){let r=await fetch('/api/manifest?token='+encodeURIComponent(TOKEN)),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);DATA=j;[...new Set(j.clips.map(x=>x.video_id))].sort().forEach(v=>video.insertAdjacentHTML('beforeend',`<option>${v}</option>`));label.onchange=video.onchange=render;render();if(shown.length)openAt(0)}
function render(){shown=DATA.clips.filter(x=>(!video.value||x.video_id===video.value)&&(!label.value||(label.value==='multi'?x.labels.length>1:x.labels.includes(label.value))));stats.textContent=`${shown.length}片段 / ${shown.reduce((n,x)=>n+x.events.length,0)}事件`;list.innerHTML=shown.map((x,i)=>`<div class="item ${i===current?'active':''}" onclick="openAt(${i})"><b>${i+1}. ${fmt(x.primary_time_sec)}</b> ${x.events.map(e=>`<span class="mini ${e.label}">${e.label_zh}</span>`).join('')}<div class="meta">${x.video_id} · ${x.media.width}×${x.media.height}</div></div>`).join('')||'<div class="empty">无匹配片段</div>';if(current>=shown.length)current=-1}
function openAt(i){if(!shown.length)return;current=Math.max(0,Math.min(shown.length-1,i));let x=shown[current];player.pause();player.removeAttribute('src');player.load();player.src='/clips/'+encodeURIComponent(x.filename)+'?token='+encodeURIComponent(TOKEN);player.load();position.textContent=`${current+1}/${shown.length} · ${x.video_id} · 原视频 ${fmt(x.primary_time_sec)}`;info.innerHTML=`<b>确认的原始 GT 漏标</b><div class="tags">${x.events.map(e=>`<button class="tag ${e.label}" onclick="jump(${e.media_offset_sec})">${e.label_zh} · ${fmt(e.time_sec)}</button>`).join('')}</div><div class="meta">源案例 ${x.case_id} · ${x.media.width}×${x.media.height} · ${x.media.video_codec.toUpperCase()} + ${x.media.audio_codec.toUpperCase()} · ${(x.size_bytes/1048576).toFixed(1)} MiB</div>`;player.onloadedmetadata=()=>{player.currentTime=0;if(auto.checked)player.play().catch(()=>{})};player.onended=()=>{if(autoNext.checked&&current+1<shown.length)openAt(current+1)};render();setTimeout(()=>document.querySelector('.item.active')?.scrollIntoView({block:'nearest'}),0)}
function move(d){openAt(current+d)}function replay(){player.currentTime=0;player.play().catch(()=>{})}function jump(t){player.currentTime=Math.max(0,t-2);player.play().catch(()=>{})}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.code==='Space'){e.preventDefault();player.paused?player.play():player.pause()}});boot().catch(e=>info.innerHTML=`<div class="empty">${e.message}</div>`)
</script></body></html>
