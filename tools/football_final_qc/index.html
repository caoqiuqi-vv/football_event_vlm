<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>足球事件最终质检</title><style>
:root{--bg:#0d1520;--panel:#141f2c;--line:#2a394b;--text:#edf4ff;--muted:#98a9be;--blue:#56a8ff;--green:#49d49d;--red:#ff7979;--amber:#ffc760}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}.top{flex:0 0 auto;padding:8px 12px;background:#101b28;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0 0 6px}.stats,.filters,.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill{padding:3px 7px;border-radius:99px;background:#213044;color:#cdd9e8}.warn{color:var(--amber)}.ok{color:var(--green)}.bad{color:var(--red)}select,input,textarea,button{font:inherit;color:var(--text);background:#1c2a3b;border:1px solid #3a4b61;border-radius:7px;padding:6px}button{cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:#147348;border-color:#39bd81;font-weight:700}.danger{background:#7b3030}.keep{background:#66500e}.layout{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:8px;padding:8px}.leftPane{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}.videoArea{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}.caseHead{flex:0 0 auto;min-height:32px}.videoWrap{flex:1 1 auto;min-height:0;background:#000;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}.videoFrame{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}.videoFrame video{display:block;width:100%;height:100%;object-fit:contain}.videoControls{flex:0 0 auto;padding:6px;background:var(--panel);display:flex;gap:6px;align-items:center}.eventRail{flex:0 0 126px;min-width:0;display:flex;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;padding:3px;background:#0a111a;border:1px solid var(--line);border-radius:8px}.case{flex:0 0 196px;height:104px;padding:8px;border-right:1px solid #263447;border-radius:6px;cursor:pointer;transition:.12s;overflow:hidden}.case:hover,.case.active{background:#1c2a3b}.case.active{box-shadow:inset 0 -4px var(--blue);background:#203147}.case.done{background:#10271f}.case.done .caseTitle:before{content:'✓ ';color:var(--green);font-weight:800}.case.pending{background:#302812}.case.stale{background:#351e23}.case .meta{color:var(--muted);font-size:11px;margin-top:3px}.status{float:right;padding:2px 5px;border-radius:10px;background:#26384e;font-size:10px}.done .status{background:#18563e}.risk{display:inline-block;margin:3px 2px 0 0;padding:1px 3px;background:#633f1e;border-radius:4px;font-size:9px}.rightPane{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}.rightHead{flex:0 0 auto;padding:9px;border-bottom:1px solid var(--line)}.rightScroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:8px}.sourceGrid{display:grid;grid-template-columns:1fr;gap:7px}.stepTitle{display:flex;align-items:center;gap:7px;margin:2px 0 7px;font-size:14px}.stepNo{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;border-radius:50%;background:#275074;color:#fff;font-weight:800}.evidenceRow{display:grid;grid-template-columns:96px 1fr;min-height:48px;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#111b28}.evidenceKey{display:flex;align-items:center;justify-content:center;font-weight:700;padding:7px;text-align:center}.evidenceKey.gtKey{background:#5b4518;color:#ffe09a}.evidenceKey.firstKey{background:#173f61;color:#a9d9ff}.evidenceValue{padding:7px;display:flex;flex-wrap:wrap;align-items:center}.flowArrow{text-align:center;color:#6f8cab;font-size:20px;line-height:24px}.riskBanner{padding:8px 10px;margin-bottom:8px;border-radius:7px;background:#17354d;border-left:4px solid var(--blue)}.riskBanner.high{background:#4a2f18;border-color:var(--amber)}.finalBlock{border:1px solid #2c6b58;border-radius:8px;background:#10271f;padding:8px}.quickLabel{margin-top:7px;color:var(--muted);font-size:11px}.box{background:#111b28;border:1px solid var(--line);border-radius:7px;padding:7px}.box h3{margin:0 0 4px;font-size:13px}.event{display:inline-block;margin:2px 3px 2px 0;padding:4px 6px;border-radius:5px;background:#1b2a3b;cursor:pointer}.event:hover{outline:1px solid var(--blue)}.gt{border-left:3px solid var(--amber)}.first{border-left:3px solid var(--blue)}.rec{border-left:3px solid var(--green)}.mergedEvidence{opacity:.72;border-left:3px solid #66788d}.mergedEvidence .small{color:#ffc760}details.mergedGroup{width:100%;margin-top:5px;color:var(--muted)}details.mergedGroup summary{cursor:pointer}.editorTitle{margin:10px 0 5px}.editorRows{min-height:0}.anchor{padding:8px 0;border-bottom:1px solid #2a394b}.anchorTop{display:flex;align-items:center;gap:6px;margin-bottom:6px}.anchorTop input{width:105px}.chips{display:flex;flex-wrap:wrap;gap:4px}.chip{display:inline-flex;align-items:center;cursor:pointer;border:1px solid #435369;border-radius:7px;padding:6px 7px;background:#192536;color:#aebed1;user-select:none}.chip input{display:none}.chip.on{background:#145c8e;border-color:#62b7f3;color:white}.chip.gtline{box-shadow:inset 0 -2px var(--amber)}.rightFoot{flex:0 0 auto;padding:8px;border-top:1px solid var(--line);background:#101a26}.rightFoot textarea{width:100%;height:42px;resize:none;margin-bottom:6px}.confirmButton{font-size:16px;padding:10px 16px;flex:1}.notice{padding:8px;margin:8px 0;background:#3f3216;border:1px solid #7e6528;border-radius:7px}.small{font-size:11px;color:var(--muted)}.progressStrong{color:#fff;font-weight:700}.empty{color:var(--muted);padding:50px;text-align:center}
@media(max-width:1150px){.layout{grid-template-columns:minmax(0,1fr) 370px}.case{flex-basis:175px}.chip{padding:5px}}@media(max-width:800px){html,body{overflow:auto}.layout{display:block}.leftPane{height:680px}.rightPane{height:720px;margin-top:8px}.eventRail{height:126px}}
</style></head><body><header class="top"><h1>足球事件最终质检</h1><div class="stats" id="stats"></div><div class="filters"><select id="videoFilter"><option value="">全部视频</option></select><select id="statusFilter"><option value="">全部状态</option><option value="unreviewed">仅未终审</option><option value="stale">来源已变化</option><option value="pending">待确认</option><option value="confirmed">已确认</option><option value="keep_both">保留近邻</option><option value="deleted">已删除</option></select><select id="sortMode"><option value="time">按视频时间</option><option value="risk">高风险优先</option></select><label><input type="checkbox" id="completeOnly" checked> 仅完整视频</label><label><input type="checkbox" id="riskOnly"> 仅高风险</label><label><input type="checkbox" id="autoPlay" checked> 自动播放</label><input id="reviewer" size="10" placeholder="审核员"><button onclick="location.reload()">刷新</button></div></header><div class="layout"><section class="leftPane"><div class="videoArea" id="videoArea"><div class="empty">从下方事件带选择事件</div></div><aside class="eventRail" id="list"></aside></section><aside class="rightPane" id="rightPane"><div class="empty">右侧显示 GT、模型/初审结果和人工终审结果</div></aside></div>
<script>
const QS=new URLSearchParams(location.search),TOKEN=QS.get('token')||'';let DATA=null,current=null,anchors=[];const labels=['shot','save','corner','free_kick','kickoff','penalty','throw_in','back_pass','set_piece'];const zh={shot:'射门',save:'扑救',corner:'角球',free_kick:'任意球',kickoff:'中圈开球',penalty:'点球',throw_in:'界外球',back_pass:'回传',set_piece:'定位球'};const statusZh={unreviewed:'未审',stale:'需重审',pending:'待确认',confirmed:'已确认',keep_both:'保留两条',deleted:'已删除'};
const fmt=t=>{let m=Math.floor(t/60),s=(t-m*60).toFixed(3).padStart(6,'0');return `${m}:${s}`},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){let r=await fetch(path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(TOKEN),{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}}),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}function decision(c){return DATA.decisions[c.id]||{status:'unreviewed',revision:0,selected_events:[]}}function done(c){return ['confirmed','keep_both','deleted'].includes(decision(c).status)}function isRisk(c){return c.priority>=100||c.risk_types.some(x=>['gt_deleted','gt_label_changed','gt_time_changed','near_duplicate','same_gt_duplicate','source_pending'].includes(x))}
function visibleCases(){let vf=videoFilter.value,sf=statusFilter.value,co=completeOnly.checked,ro=riskOnly.checked,a=DATA.cases.filter(c=>(!vf||c.video_id===vf)&&(!sf||decision(c).status===sf)&&(!co||c.video_first_pass_complete)&&(!ro||isRisk(c)));return a.sort((x,y)=>sortMode.value==='risk'?(y.priority-x.priority||x.video_id.localeCompare(y.video_id)||x.start_sec-y.start_sec):(x.video_id.localeCompare(y.video_id)||x.start_sec-y.start_sec||y.priority-x.priority))}
function render(){let a=visibleCases(),currentIndex=current?a.findIndex(x=>x.id===current.id):-1,completed=a.filter(done).length;list.innerHTML=a.map((c,i)=>{let d=decision(c),cls=done(c)?'done':d.status==='pending'?'pending':d.status==='stale'?'stale':'';return `<div class="case ${cls} ${current&&current.id===c.id?'active':''}" data-id="${c.id}"><span class="status">${statusZh[d.status]||d.status}</span><div class="caseTitle"><b>${i+1}. ${fmt(c.start_sec)}</b></div><div class="small">${c.video_id.slice(-8)}</div><div>${c.risk_types.slice(0,3).map(x=>`<span class="risk">${x}</span>`).join('')}</div><div class="meta">GT ${c.original_gt.length} / 初审 ${c.first_pass_events.length} / 推荐 ${c.recommended_events.length}</div></div>`}).join('')||'<div class="empty">没有符合条件的案例</div>';document.querySelectorAll('.case').forEach(x=>x.onclick=()=>openCase(x.dataset.id));stats.innerHTML=`<span class="pill">当前 <span class="progressStrong">${currentIndex>=0?currentIndex+1:'—'}/${a.length}</span></span><span class="pill">本列表已审 ${completed}/${a.length}</span><span class="pill">全部已审 ${Object.values(DATA.decisions).filter(x=>['confirmed','keep_both','deleted'].includes(x.status)).length}</span><span class="pill warn">高风险 ${DATA.summary.high_priority}</span><span class="pill">完整视频 ${DATA.summary.first_pass_complete_videos}/18</span>`;let active=document.querySelector('.case.active');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}function norm(e,origin){return {source_id:e.source_id||e.id||('manual_'+crypto.randomUUID()),semantic_label:e.semantic_label||e.label,time_sec:+e.time_sec,lineage_gt_ids:e.lineage_gt_ids||(e.id&&origin==='gt'?[e.id]:[]),origin:e.origin||origin}}
function toAnchors(events){let out=[];events.map(e=>norm(e,e.origin||'unknown')).sort((a,b)=>a.time_sec-b.time_sec).forEach(e=>{let a=out.find(x=>Math.abs(x.time_sec-e.time_sec)<=.05&&!x.labels.includes(e.semantic_label));if(!a){a={id:'anchor_'+crypto.randomUUID(),time_sec:e.time_sec,labels:[],meta:{}};out.push(a)}a.labels.push(e.semantic_label);a.meta[e.semantic_label]=e});return out}
function flatten(){let out=[];anchors.forEach(a=>a.labels.forEach(l=>{let m=a.meta[l]||{};out.push({source_id:m.source_id||`${a.id}_${l}`,semantic_label:l,time_sec:+a.time_sec,lineage_gt_ids:m.lineage_gt_ids||[],origin:m.origin||'final_manual'})}));return out.sort((a,b)=>a.time_sec-b.time_sec||a.semantic_label.localeCompare(b.semantic_label))}
function uniq(a){let s=new Set;return a.filter(e=>{let k=`${e.semantic_label}|${(+e.time_sec).toFixed(3)}|${(e.lineage_gt_ids||[]).join(',')}`;if(s.has(k))return false;s.add(k);return true})}
function setFrom(k){let e=[];if(k==='gt')e=current.original_gt.map(x=>norm(x,'gt'));if(k==='first')e=current.first_pass_events.map(x=>norm(x,'first_pass'));if(k==='recommended')e=current.recommended_events.map(x=>norm(x,'recommended'));if(k==='all')e=uniq([...current.original_gt.map(x=>norm(x,'gt')),...current.first_pass_events.map(x=>norm(x,'first_pass'))]);anchors=k==='none'?[]:toAnchors(e);drawEditor()}
function ev(e,cls,note=''){return `<div class="event ${cls}" onclick="jump(${e.time_sec})"><b>${zh[e.semantic_label]||e.semantic_label}</b> · ${fmt(e.time_sec)} ${e.lineage_gt_ids?.length?'<span class="small">GT血缘</span>':''} ${note?`<span class="small">${note}</span>`:''}</div>`}function firstEvidence(c){let keep=new Set(c.recommended_events.map(e=>e.id)),active=c.first_pass_events.filter(e=>keep.has(e.id)),merged=c.first_pass_events.filter(e=>!keep.has(e.id)),main=active.map(e=>ev(e,'first')).join('');if(merged.length)main+=`<details class="mergedGroup"><summary>已并入终稿的重复来源证据 ${merged.length} 条（默认折叠）</summary>${merged.map(e=>ev(e,'mergedEvidence','仅作证据，不是第二条标注')).join('')}</details>`;return main||'<span class="small">初审判断为无事件/删除</span>'}
function riskMessage(c){let r=c.risk_types;if(r.includes('same_gt_duplicate')||r.includes('near_duplicate'))return ['high','发现同类近邻结果：判断是时间偏移重复，还是两个真实事件'];if(r.includes('gt_deleted'))return ['high','初审删除了原始 GT：重点确认是否确实应删除'];if(r.includes('gt_label_changed'))return ['high','初审修改了原始 GT 类别：请核对类别'];if(r.includes('gt_time_changed'))return ['high','初审明显修改了事件时间：请核对发生时刻'];if(r.includes('new_event'))return ['','初审新增了事件：确认是否为真实漏标'];return ['','原始 GT 与初审结果基本一致，确认即可'];}
function openCase(id){let oldPlayer=document.getElementById('player');if(oldPlayer){oldPlayer.pause();oldPlayer.removeAttribute('src');oldPlayer.load()}current=DATA.cases.find(x=>x.id===id);let d=decision(current),hasSaved=['confirmed','keep_both','deleted','pending','stale'].includes(d.status),base=hasSaved?d.selected_events:current.recommended_events,rm=riskMessage(current);anchors=toAnchors(base);videoArea.innerHTML=`<div class="caseHead toolbar"><button onclick="move(-1)">← 上一条</button><button onclick="move(1)">下一条 →</button><b>${current.video_id}</b><span>${fmt(current.start_sec)}–${fmt(current.end_sec)}</span><span class="pill">${statusZh[d.status]||d.status}</span></div><div class="videoWrap"><div class="videoFrame"><video id="player" controls preload="auto" autoplay playsinline src="/media/${current.video_id}?token=${encodeURIComponent(TOKEN)}"></video></div><div class="videoControls"><button onclick="replay()">▶ 重播</button><button onclick="seek(-3)">−3秒</button><button onclick="seek(3)">+3秒</button><button id="soundButton" class="warn" style="display:none" onclick="enableSound()">🔇 开启声音</button><span id="playHint" class="small">自动播放至 ${fmt(current.end_sec)}</span></div></div>`;rightPane.innerHTML=`<div class="rightHead"><b>终审判断</b> ${current.video_first_pass_complete?'<span class="ok">· 数据完整</span>':'<span class="warn">· 临时数据</span>'}</div><div class="rightScroll"><div class="riskBanner ${rm[0]}">${rm[1]}</div><div class="stepTitle"><span class="stepNo">1</span><b>只读对照信息</b><span class="small">点击事件可跳转播放</span></div><div class="sourceGrid"><div class="evidenceRow"><div class="evidenceKey gtKey">原始 GT</div><div class="evidenceValue">${current.original_gt.map(e=>ev(e,'gt')).join('')||'<span class="small">没有原始 GT</span>'}</div></div><div class="evidenceRow"><div class="evidenceKey firstKey">模型候选<br>经初审后</div><div class="evidenceValue">${firstEvidence(current)}</div></div></div><div class="flowArrow">↓</div><div class="finalBlock"><div class="stepTitle"><span class="stepNo">2</span><b>最终人工结果</b><span class="small">仅有错误时修改</span></div><div class="editorRows" id="editorRows"></div><div class="quickLabel">快速替换最终结果</div><div class="toolbar"><button onclick="setFrom('recommended')">系统建议</button><button onclick="setFrom('gt')">恢复原 GT</button><button onclick="setFrom('first')">采用初审</button><button class="keep" onclick="setFrom('all')">GT+初审</button><button class="danger" onclick="setFrom('none')">判定无事件</button><button onclick="addAnchor()">+ 当前时间</button></div></div></div><div class="rightFoot"><textarea id="note" placeholder="有修改时可填写备注">${esc(d.note||'')}</textarea><div class="toolbar"><button class="primary confirmButton" onclick="save('confirm',true)">结果正确 · 确认并下一条</button><button class="keep" onclick="save('keep_both',true)">保留近邻</button><button onclick="save('pending',true)">待确认</button><span id="msg"></span></div></div>`;let v=document.getElementById('player');v.onloadedmetadata=()=>{v.currentTime=current.start_sec;startPlayback(v)};v.ontimeupdate=()=>{if(v.currentTime>=current.end_sec){v.pause();v.currentTime=current.end_sec}};drawEditor();render()}function drawEditor(){let r=document.getElementById('editorRows');if(!r)return;r.innerHTML=anchors.map((a,i)=>`<div class="anchor"><div class="anchorTop"><b>时间点 ${i+1}</b><input type="number" step="0.001" value="${a.time_sec}" onchange="anchors[${i}].time_sec=+this.value"><span class="small">${fmt(a.time_sec)}</span><button class="danger" onclick="removeAnchor(${i})">删除时间点</button></div><div class="chips">${labels.map(l=>{let on=a.labels.includes(l),gt=on&&(a.meta[l]?.lineage_gt_ids||[]).length;return `<label class="chip ${on?'on':''} ${gt?'gtline':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleLabel(${i},'${l}',this.checked)">${zh[l]}${gt?' ★':''}</label>`}).join('')}</div></div>`).join('')||'<div class="notice">终稿为空；确认保存将明确删除本案例事件。</div>'}
function toggleLabel(i,l,on){let a=anchors[i];if(on&&!a.labels.includes(l))a.labels.push(l);if(!on)a.labels=a.labels.filter(x=>x!==l);drawEditor()}function removeAnchor(i){anchors.splice(i,1);drawEditor()}function addAnchor(){let v=document.getElementById('player'),t=v&&Number.isFinite(v.currentTime)?v.currentTime:(current.start_sec+current.end_sec)/2;anchors.push({id:'anchor_'+crypto.randomUUID(),time_sec:+t.toFixed(3),labels:['shot'],meta:{}});drawEditor()}function seek(d){let v=document.getElementById('player');v.currentTime=Math.max(current.start_sec,Math.min(current.end_sec,v.currentTime+d))}function jump(t){let v=document.getElementById('player');if(v){v.currentTime=Math.max(current.start_sec-2,t-2);v.play().catch(()=>{})}}function replay(){let v=document.getElementById('player');v.currentTime=current.start_sec;v.play().catch(()=>{})}
function startPlayback(v){if(!autoPlay.checked)return;v.muted=false;let p=v.play();if(p)p.catch(()=>{v.muted=true;let q=v.play(),b=document.getElementById('soundButton'),h=document.getElementById('playHint');if(b)b.style.display='inline-block';if(h)h.textContent='已自动播放（浏览器要求点击开启声音）';if(q)q.catch(()=>{if(h)h.textContent='浏览器阻止自动播放，请点击重播'})})}function enableSound(){let v=document.getElementById('player'),b=document.getElementById('soundButton'),h=document.getElementById('playHint');if(!v)return;v.muted=false;v.play().catch(()=>{});if(b)b.style.display='none';if(h)h.textContent=`有声播放至 ${fmt(current.end_sec)}`}
function move(delta){let a=visibleCases();if(!a.length)return;let i=current?a.findIndex(x=>x.id===current.id):-1,i2=Math.max(0,Math.min(a.length-1,(i<0?0:i+delta)));openCase(a[i2].id)}function nextPendingId(){let a=visibleCases(),i=a.findIndex(x=>x.id===current.id);for(let k=1;k<a.length;k++){let j=(i+k)%a.length;if(!done(a[j]))return a[j].id}return null}
async function save(action,forceNext=false){let m=document.getElementById('msg'),next=nextPendingId();try{let d=decision(current),body={case_id:current.id,source_hash:current.source_hash,expected_revision:d.revision,action,selected_events:flatten(),note:document.getElementById('note').value,reviewer:reviewer.value||localStorage.finalReviewer||DATA.policy.default_reviewer};localStorage.finalReviewer=body.reviewer;let j=await api('/api/decision',{method:'POST',body:JSON.stringify(body)});DATA.decisions[current.id]=j.decision;render();if(forceNext&&next)openCase(next);else openCase(current.id)}catch(e){m.className='bad';m.textContent=e.message}}
function savePrefs(){localStorage.finalAutoPlayV2=autoPlay.checked?'1':'0'}document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;let v=document.getElementById('player');if(e.code==='Space'&&v){e.preventDefault();v.paused?v.play():v.pause()}if(e.key==='ArrowLeft')seek(-3);if(e.key==='ArrowRight')seek(3);if(e.key==='[')move(-1);if(e.key===']')move(1);if(e.ctrlKey&&e.key==='Enter')save('confirm',true)});
async function boot(){try{DATA=await api('/api/bootstrap');Object.keys(DATA.videos).forEach(v=>videoFilter.insertAdjacentHTML('beforeend',`<option>${v}</option>`));reviewer.value=QS.get('reviewer')||localStorage.finalReviewer||DATA.policy.default_reviewer||'终审员1';if(localStorage.finalAutoPlayV2!==null)autoPlay.checked=localStorage.finalAutoPlayV2==='1';[videoFilter,statusFilter,sortMode,completeOnly,riskOnly].forEach(x=>x.onchange=render);[autoPlay].forEach(x=>x.onchange=savePrefs);list.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){list.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});render()}catch(e){rightPane.innerHTML=`<div class="empty bad">${esc(e.message)}</div>`}}boot();
</script></body></html>
